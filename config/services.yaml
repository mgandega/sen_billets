# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    paydunya.private_key: '%env(PAYDUNYA_PRIVATE_KEY)%'
    paydunya.public_key: '%env(PAYDUNYA_PUBLIC_KEY)%'
    paydunya.token: '%env(PAYDUNYA_TOKEN)%'
    paydunya.mode: '%env(PAYDUNYA_MODE)%'
    app.url: '%env(APP_URL)%'
    orange_sms.api_key: '%env(default::ORANGE_SMS_API_KEY)%'
    twilio.account_sid: '%env(default::TWILIO_ACCOUNT_SID)%'
    twilio.auth_token: '%env(default::TWILIO_AUTH_TOKEN)%'
    twilio.phone_number: '%env(default::TWILIO_PHONE_NUMBER)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    App\Service\QRCodeService: ~
    Endroid\QrCode\Writer\PngWriter: ~


    # Endroid\QrCode\Builder\PngBuilder:
    #     arguments:
    #         $writer: '@Endroid\QrCode\Writer\PngWriter'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # App\Service\PaymentService:
    #     arguments:
    #         $paydunyaMasterKey: '%paydunya.master_key%'
    #         $paydunyaPrivateKey: '%paydunya.private_key%'
    #         $paydunyaPublicKey: '%paydunya.public_key%'
    #         $paydunyaToken: '%paydunya.token%'
    #         $paydunyaMode: '%paydunya.mode%'
    #         $qrCodeBuilderFactory: '@App\Factory\QrCodeBuilderFactory'
    App\Factory\QrCodeBuilderFactory: ~

    Endroid\QrCodeBundle\Twig\QrCodeExtension:
        tags: ['twig.extension']

    # App\Service\PaymentService:
    #     arguments:
    #         $pdfGenerator: '@App\Service\PdfGenerator'
    #         $paydunyaMasterKey: '%paydunya.master_key%'
    #         $paydunyaPrivateKey: '%paydunya.private_key%'
    #         $paydunyaPublicKey: '%paydunya.public_key%'
    #         $paydunyaToken: '%paydunya.token%'
    #         $paydunyaMode: '%paydunya.mode%'
    App\Service\PaymentService:
        arguments:
            $pdfGenerator: '@App\Service\PdfGenerator'
            $paydunyaPrivateKey: '%paydunya.private_key%'
            $paydunyaPublicKey: '%paydunya.public_key%'
            $paydunyaToken: '%paydunya.token%'
            $paydunyaMode: '%paydunya.mode%'
    # App\Service\PaymentService:
    #     arguments:
    #         $pdfGenerator: '@App\Service\PdfGenerator'


    # Notification service configuration
    App\Service\NotificationChannelService:
        arguments:
            $orangeSmsApiKey: '%orange_sms.api_key%'
            $twilioAccountSid: '%twilio.account_sid%'
            $twilioAuthToken: '%twilio.auth_token%'
            $twilioPhoneNumber: '%twilio.phone_number%'

    App\Factory\QrCodeBuilderFactory:
        public: true

