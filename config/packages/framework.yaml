# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    http_method_override: false
    handle_all_throwables: true
    trusted_proxies: '127.0.0.1,REMOTE_ADDR'
    trusted_hosts:
        - '^localhost$'
        - '^127\.0\.0\.1$'
        - '^0\.0\.0\.0$'
        - '^[a-z0-9-]+\.ngrok-free\.app$'
        - '^64ce72c2c7f6\.ngrok-free\.app$'

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    #esi: true
    #fragments: true
    php_errors:
        log: true

    # HTTP Client configuration
    http_client:
        default_options:
            timeout: 30
            max_redirects: 5
            verify_peer: true
            verify_host: true

    # Asset Mapper configuration for Symfony 7.2
    asset_mapper:
        paths:
            - '%kernel.project_dir%/assets'
        excluded_patterns:
            - '*/node_modules/*'
            - '*/tests/*'
            - '*.md'
            - '*.txt'
        # Enable server mode for development
        server: true
        # File extensions to process
        extensions:
            - '.js'
            - '.css'
            - '.png'
            - '.jpg'
            - '.jpeg'
            - '.gif'
            - '.svg'
            - '.woff'
            - '.woff2'
            - '.ttf'
            - '.eot'
        # The importmap file path
        importmap_path: '%kernel.project_dir%/importmap.php'
        # The vendor directory for downloaded assets
        vendor_dir: '%kernel.project_dir%/assets/vendor'
        # The public prefix for assets
        public_prefix: '/assets/'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file