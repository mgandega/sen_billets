[databases]
sen_billets = host=postgres port=5432 dbname=sen_billets

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres, symfony
pool_mode = session
max_client_conn = 1000
default_pool_size = 20
ignore_startup_parameters = extra_float_digits
