version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: sen_billets_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: symfony
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: sen_billets
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # PgBouncer (connection pooler)
  pgbouncer:
    image: edoburu/pgbouncer
    container_name: sen_billets_pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      DB_USER: symfony
      DB_PASSWORD: secret
      DB_HOST: postgres
      DB_NAME: sen_billets
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
    depends_on:
      - postgres

  # Redis (cache sessions + Doctrine)
  redis:
    image: redis:7-alpine
    container_name: sen_billets_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # pgAdmin (équivalent phpMyAdmin mais pour PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4
    container_name: sen_billets_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8005:80"
    depends_on:
      - postgres

  # Apache + PHP (Symfony)
  apache:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    container_name: sen_billets_apache
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./var/pdf_qrcodes:/var/www/html/var/pdf_qrcodes
    depends_on:
      - pgbouncer
      - redis
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      # Connexion Symfony via PgBouncer (port 6432)
      - DATABASE_URL=postgresql://symfony:secret@pgbouncer:6432/sen_billets?serverVersion=16&charset=utf8
      # Redis pour cache et sessions
      - REDIS_URL=redis://redis:6379

volumes:
  postgres_data:
  redis_data: