version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sen_billets_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: symfony
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: sen_billets
    ports:
      - "5433:5432"   # accessible depuis ton hôte si besoin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: sen_billets_pgbouncer
    restart: unless-stopped
    ports:
      - "6432:5432"   # host:container mapping
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    command: pgbouncer /etc/pgbouncer/pgbouncer.ini
    depends_on:
      - postgres
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: sen_billets_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - default

  pgadmin:
    image: dpage/pgadmin4
    container_name: sen_billets_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8005:80"
    depends_on:
      - postgres
    networks:
      - default

  apache:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    container_name: sen_billets_apache
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./var/pdf_qrcodes:/var/www/html/var/pdf_qrcodes
    depends_on:
      - pgbouncer
      - redis
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - DATABASE_URL=postgresql://symfony:secret@pgbouncer:5432/sen_billets?serverVersion=16&charset=utf8
      - REDIS_URL=redis://redis:6379
    networks:
      - default

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: sen_billets_default
