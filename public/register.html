<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - Sen-Billets</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 128 128%22><text y=%221.2em%22 font-size=%2296%22>🎫</text></svg>">
  <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/assets/styles/app.css">
</head>
<body>
  <div class="min-vh-100 d-flex align-items-center" style="background: linear-gradient(135deg, var(--primary-color), var(--info-color));">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <!-- Back button -->
          <div class="mb-4">
            <a href="/" class="text-white text-decoration-none">
              <i class="bi bi-arrow-left me-2"></i>Retour à l'accueil
            </a>
          </div>

          <!-- Registration card -->
          <div class="card border-0 shadow-lg">
            <div class="card-body p-5">
              <!-- Logo -->
              <div class="text-center mb-5">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                  <i class="bi bi-calendar-event fs-1"></i>
                </div>
                <h2 class="fw-bold text-dark mb-2">Rejoindre Sen-Billets</h2>
                <p class="text-muted">Créez votre compte pour découvrir et organiser des événements</p>
              </div>

              <form method="post" action="/register">
                <div class="row g-3">
                  <div class="col-12">
                    <label for="name" class="form-label fw-medium">Nom complet</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-person text-muted"></i>
                      </span>
                      <input type="text" id="name" name="name" class="form-control border-start-0 ps-0" placeholder="Votre nom complet" required>
                    </div>
                  </div>

                  <div class="col-12">
                    <label for="email" class="form-label fw-medium">Adresse email</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-envelope text-muted"></i>
                      </span>
                      <input type="email" id="email" name="email" class="form-control border-start-0 ps-0" placeholder="votre@email.com" required>
                    </div>
                  </div>

                  <div class="col-12">
                    <label for="phone" class="form-label fw-medium">Téléphone</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-telephone text-muted"></i>
                      </span>
                      <input type="tel" id="phone" name="phone" class="form-control border-start-0 ps-0" placeholder="+221 XX XXX XX XX">
                    </div>
                  </div>

                  <div class="col-md-6">
                    <label for="password" class="form-label fw-medium">Mot de passe</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-lock text-muted"></i>
                      </span>
                      <input type="password" id="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <label for="password_confirm" class="form-label fw-medium">Confirmer le mot de passe</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-lock text-muted"></i>
                      </span>
                      <input type="password" id="password_confirm" name="password_confirm" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                    </div>
                  </div>
                </div>

                <!-- User type selection -->
                <div class="mt-4">
                  <div class="card bg-light border-0">
                    <div class="card-body p-3">
                      <h6 class="fw-bold mb-3">Type de compte</h6>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="isOrganizer" name="isOrganizer">
                        <label class="form-check-label" for="isOrganizer">
                          Je souhaite organiser des événements
                        </label>
                      </div>
                      <small class="text-muted">
                        En cochant cette case, vous pourrez créer et gérer vos propres événements
                      </small>
                    </div>
                  </div>
                </div>

                <!-- Terms -->
                <div class="mt-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="agreeTerms" name="agreeTerms" required>
                    <label class="form-check-label" for="agreeTerms">
                      J'accepte les conditions d'utilisation
                    </label>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold mt-4 mb-4">
                  Créer mon compte
                </button>
              </form>

              <div class="text-center">
                <p class="text-muted mb-0">
                  Déjà un compte ? 
                  <a href="/login" class="text-primary text-decoration-none fw-medium">Se connecter</a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
